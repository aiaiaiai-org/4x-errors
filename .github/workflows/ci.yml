name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ruby:
    name: Ruby correctness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: four_x_errors_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d four_x_errors_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/four_x_errors_test
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Verify locked dependencies
        run: bundle check
      - name: Check formatting and lint
        run: bundle exec rubocop
      - name: Run tests
        run: bundle exec rspec

  browser-sdk:
    name: Browser SDK correctness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/browser
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser SDK test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run browser SDK tests
        run: npm test
      - name: Verify package can be packed
        run: npm pack --dry-run

  docker:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --tag 4x-errors:ci .
