name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby:
    name: Ruby correctness
    runs-on: ubuntu-latest

    # An ephemeral database, matching the PostgreSQL major version Supabase
    # runs. The production DATABASE_URL is not available to this job and must
    # never be: it belongs to the production environment only.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: 4x_errors_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/4x_errors_test

    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Refuse production credentials in regular CI
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo 'DATABASE_URL is set in a job that must only use the ephemeral database' >&2
            exit 1
          fi

      - name: Verify locked dependencies
        run: bundle check

      - name: Check formatting and lint
        run: bundle exec rubocop

      - name: Run protocol contract tests
        run: bundle exec rspec spec/aiaiaiai/errors/protocol

      - name: Run unit tests
        run: bundle exec rspec --tag '~database'

      - name: Run PostgreSQL integration tests
        run: bundle exec rspec --tag database

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Audit dependencies for known vulnerabilities
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check

  docker:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build --tag 4x-errors:ci .

      # The image must load without any credentials configured.
      - name: Start image
        run: docker run --rm 4x-errors:ci ruby -e "require './lib/aiaiaiai/errors/collector'; puts 'collector loaded'"
