name: Package collector

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - Gemfile
      - Gemfile.lock
      - .ruby-version
      - app.rb
      - config.ru
      - lib/**
      - .github/workflows/package-collector.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: package-4x-errors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable collector image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/aiaiaiai-org/4x-errors:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Verify published image
        run: docker buildx imagetools inspect "ghcr.io/aiaiaiai-org/4x-errors:sha-${GITHUB_SHA}" >/dev/null
