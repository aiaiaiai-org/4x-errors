name: Publish browser SDK

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/browser

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure trusted-publishing npm CLI
        run: npm install --global 'npm@>=11.5.1 <12'

      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test package
        run: npm test

      - name: Verify package archive
        run: npm pack --dry-run

      - name: Publish public package
        run: npm publish --access public
